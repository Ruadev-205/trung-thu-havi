<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050207">
  <meta name="description" content="Một món quà Trung thu dành cho Hoàng Hà Vi.">
  <title>Trung thu · Hoàng Hà Vi</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50' font-size='50'%3E🌙%3C/text%3E%3C/svg%3E">

  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #050207;
      color: #ffe9f5;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      height: 100dvh;
      background: #050207;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .opening {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(ellipse at 50% 40%, #351127a8, transparent 65%),
        #05020750;
      transition: opacity .8s ease, visibility .8s;
      overflow-y: auto;
    }

    .opening.closed {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .card {
      width: min(100%, 430px);
      text-align: center;
      padding: 30px 0;
    }

    .moon {
      font-size: 76px;
      margin-bottom: 30px;
      filter: drop-shadow(0 0 24px #f6bd7755);
    }

    .eyebrow {
      margin: 0 0 20px;
      font-size: 14px;
      letter-spacing: .24em;
      color: #d8a8c2;
    }

    h1 {
      margin: 0 0 34px;
      font-size: clamp(24px, 6vw, 34px);
      font-weight: 400;
      line-height: 1.65;
      text-wrap: balance;
    }

    h1 strong {
      display: block;
      color: #ffabd8;
      font-weight: 600;
      text-shadow: 0 0 25px #ff40967a;
    }

    button {
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 5px;
    }

    #openGift {
      min-height: 54px;
      padding: 15px 26px;
      border: 1px solid #ffa3d078;
      border-radius: 99px;
      color: #fff1f8;
      font-size: 16px;
      background: linear-gradient(135deg, #88234e, #521939);
      box-shadow: 0 0 35px #e7498e25;
      transition: transform .2s, box-shadow .2s;
    }

    #openGift:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 40px #e7498e45;
    }

    .controls {
      position: fixed;
      z-index: 3;
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      display: flex;
      gap: 8px;
    }

    .controls[hidden] { display: none; }

    .controls button {
      min-width: 46px;
      min-height: 46px;
      padding: 10px 14px;
      border: 1px solid #ffa3d033;
      border-radius: 99px;
      background: #150a16d9;
      color: #ffdaee;
      font-size: 14px;
      backdrop-filter: blur(12px);
    }

    button:disabled {
      opacity: .6;
      cursor: default;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      .opening, #openGift { transition: none; }
    }
  </style>
</head>

<body>
  <canvas id="sky" aria-hidden="true"></canvas>

  <main class="opening" id="opening">
    <div class="card">
      <div class="moon" aria-hidden="true">🌙</div>
      <p class="eyebrow">MỘT MÙA TRĂNG ĐẶC BIỆT</p>
      <h1>
        Có một món quà Trung thu dành cho
        <strong id="recipient"></strong>
        <span aria-hidden="true">🎁</span>
      </h1>
      <button id="openGift">Chạm để mở quà 🎁</button>
    </div>
  </main>

  <div class="controls" id="controls" hidden>
    <button id="motion" aria-label="Tạm dừng hiệu ứng">Tạm dừng</button>
    <button id="sound" aria-label="Bật nhạc" aria-pressed="false">
      ♫ Bật nhạc
    </button>
  </div>

  <p class="sr-only" id="accessibleMessage" aria-live="polite"></p>
  <audio id="music" loop preload="none"></audio>

  <script>
    "use strict";

    // =====================================================
    // CHỈNH TÊN, LỜI CHÚC VÀ NHẠC TẠI ĐÂY
    // =====================================================
    const CAU_HINH = {
      ten: "Hoàng Hà Vi",

      // Để trống: chỉ hiện tên.
      // Thêm mỗi lời chúc trong dấu ngoặc kép, cách nhau bằng dấu phẩy.
      loiChuc: [
        "Yêu em thật nhiều",
        "Havina",
        "Mong mọi điều dịu dàng đều đến bên em",
        "Mong những ước mơ của em thành thật",
        "Cục dànggg",
        "em iu",
        "Vi",
        "I love you",
        "Trăng tròn, còn anh thì nhớ em",
        "Em là điều ngọt ngào nhất",
        "Món quà nhỏ, nhưng thương em thật nhiều"
      ],

      // Ví dụ: "nhac.mp3" nếu đặt tệp nhạc cùng thư mục index.html.
      // Cũng có thể dùng đường dẫn HTTPS trực tiếp đến tệp nhạc.
      nhac: "./nhac.mp3",

      amLuong: 0.55,
      soDongDienThoai: 25,
      soDongMayTinh: 45
    };
    // =====================================================

    const $ = id => document.getElementById(id);
    const canvas = $("sky");
    const ctx = canvas.getContext("2d");
    const music = $("music");
    const sound = $("sound");
    const motion = $("motion");
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

    let width = 0;
    let height = 0;
    let stars = [];
    let particles = [];
    let opened = false;
    let paused = reducedMotion.matches;
    let lastTime = 0;
    let clock = 0;
    let frameId = 0;
    let resumeMusic = false;

    const random = (min, max) => min + Math.random() * (max - min);
    const wishes = CAU_HINH.loiChuc
      .filter(item => typeof item === "string" && item.trim());

    const messages = [
      `${CAU_HINH.ten} ♡`,
      ...wishes
    ];

    $("recipient").textContent = CAU_HINH.ten;
    document.title = `Trung thu · ${CAU_HINH.ten}`;

    if (CAU_HINH.nhac.trim()) {
      music.src = CAU_HINH.nhac.trim();
      music.volume = Math.max(0, Math.min(1, CAU_HINH.amLuong));
    } else {
      sound.disabled = true;
      sound.textContent = "♫ Chưa có nhạc";
      sound.setAttribute("aria-label", "Chưa có tệp nhạc");
    }

    function fontFor(particle) {
      return `${particle.size}px "Segoe UI", Arial, sans-serif`;
    }

    function createParticle(index, initial = false) {
      const isText = index % 3 !== 2;
      const depth = random(0.25, 1);
      const symbols = [
        "♥", "♡", "💕", "💗", "💖",
        "☆", "✦", "✨",
        "☾", "🌙", "🌕",
        "🥮", "🏮", "🐇",
        "🎁", "🎀", "🌸"
        ];
      const text = isText
        ? messages[Math.floor(Math.random() * messages.length)]
        : symbols[Math.floor(Math.random() * symbols.length)];

      let size = isText
        ? (width < 600 ? 15 : 18) + depth * 15
        : 19 + depth * 22;

      ctx.font = `${size}px "Segoe UI", Arial, sans-serif`;
      const maxWidth = Math.max(100, width - 44);
      let textWidth = ctx.measureText(text).width;

      // Giữ cả dòng vừa màn hình khi tên hoặc lời chúc dài.
      if (textWidth > maxWidth) {
        size *= maxWidth / textWidth;
        ctx.font = `${size}px "Segoe UI", Arial, sans-serif`;
        textWidth = ctx.measureText(text).width;
      }

      return {
        text,
        size,
        x: random(textWidth / 2 + 18, width - textWidth / 2 - 18),
        y: initial
          ? (index / particlesCount()) * height
          : -size * 3 - random(10, height * 0.15),
        speed: 17 + depth * 29,
        opacity: 0.4 + depth * 0.55,
        glow: 7 + depth * 13,
        rotation: random(-0.085, 0.085),
        phase: random(0, Math.PI * 2),
        color: text === "♥" ? "#ff304f" : "#ffaddd"
      };
    }

    function particlesCount() {
      return width < 600
        ? CAU_HINH.soDongDienThoai
        : CAU_HINH.soDongMayTinh;
    }

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;

      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const count = Math.min(190, Math.floor(width * height / 4800));
      stars = Array.from({ length: count }, () => ({
        x: random(0, width),
        y: random(0, height),
        radius: random(0.35, 1.2),
        opacity: random(0.15, 0.7),
        phase: random(0, Math.PI * 2)
      }));

      particles = Array.from(
        { length: particlesCount() },
        (_, index) => createParticle(index, true)
      );
    }

    function draw(timestamp) {
      const delta = lastTime
        ? Math.min((timestamp - lastTime) / 1000, 0.05)
        : 0;

      lastTime = timestamp;
      if (!paused) clock += delta;

      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#050207";
      ctx.fillRect(0, 0, width, height);

      // Các hạt sao phía sau chữ.
      for (const star of stars) {
        const twinkle = 0.75 + Math.sin(clock * 0.7 + star.phase) * 0.25;
        ctx.globalAlpha = star.opacity * twinkle;
        ctx.fillStyle = "#ffe8f5";
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      if (opened) {
        particles.forEach((p, index) => {
          if (!paused) p.y += p.speed * delta;

          if (p.y > height + p.size * 3) {
            particles[index] = createParticle(index);
            p = particles[index];
          }

          ctx.save();
          ctx.translate(p.x + Math.sin(clock * 0.35 + p.phase) * 5, p.y);
          ctx.rotate(p.rotation);
          ctx.font = fontFor(p);
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.globalAlpha = p.opacity;
          ctx.fillStyle = p.color;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = p.glow;
          ctx.fillText(p.text, 0, 0);
          ctx.restore();
        });
      }

      ctx.globalAlpha = 1;
      frameId = requestAnimationFrame(draw);
    }

    function updateSoundButton() {
      const playing = !music.paused;
      sound.textContent = playing ? "♫ Tắt nhạc" : "♫ Bật nhạc";
      sound.setAttribute("aria-pressed", String(playing));
      sound.setAttribute("aria-label", playing ? "Tắt nhạc" : "Bật nhạc");
    }

    async function playMusic() {
      if (!CAU_HINH.nhac.trim()) return;

      try {
        await music.play();
        updateSoundButton();
      } catch {
        sound.textContent = "♫ Thử bật nhạc";
        sound.setAttribute("aria-label", "Thử bật nhạc");
        sound.setAttribute("aria-pressed", "false");
      }
    }

    function updateMotionButton() {
      motion.textContent = paused ? "Tiếp tục" : "Tạm dừng";
      motion.setAttribute(
        "aria-label",
        paused ? "Tiếp tục hiệu ứng" : "Tạm dừng hiệu ứng"
      );
    }

    $("openGift").addEventListener("click", () => {
      if (opened) return;
      opened = true;
      $("opening").classList.add("closed");
      $("opening").setAttribute("aria-hidden", "true");
      $("opening").inert = true;
      $("controls").hidden = false;
      $("accessibleMessage").textContent =
        `Quà Trung thu dành cho ${CAU_HINH.ten}. ${wishes.join(". ")}`;

      updateMotionButton();
      motion.focus({ preventScroll: true });

      // Phát sau thao tác chạm để tương thích trình duyệt điện thoại.
      playMusic();
    });

    motion.addEventListener("click", () => {
      paused = !paused;
      updateMotionButton();
    });

    sound.addEventListener("click", () => {
      if (music.paused) {
        playMusic();
      } else {
        music.pause();
        updateSoundButton();
      }
    });

    music.addEventListener("error", () => {
      sound.textContent = "♫ Lỗi tệp nhạc";
      sound.setAttribute("aria-label", "Không tải được tệp nhạc");
      sound.setAttribute("aria-pressed", "false");
      $("accessibleMessage").textContent =
        "Không tải được tệp nhạc. Hiệu ứng vẫn hoạt động.";
    });

    // Ngừng vẽ và phát nhạc khi chuyển sang ứng dụng/tab khác.
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        cancelAnimationFrame(frameId);
        resumeMusic = !music.paused;
        music.pause();
      } else {
        lastTime = 0;
        cancelAnimationFrame(frameId);
        frameId = requestAnimationFrame(draw);
        if (resumeMusic) playMusic();
      }
    });

    window.addEventListener("resize", resize);
    resize();
    frameId = requestAnimationFrame(draw);
  </script>
<!-- Cap nhat qua Trung thu -->
  

</body>
</html>
